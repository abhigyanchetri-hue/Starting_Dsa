<!DOCTYPE html>
<html>
    <head>
        <title>Youtube.com Clone</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <style>
            .searchbox{
                height:30px;
                display: block;
                margin-bottom: 30px;
                margin-left:350px;
                width: 200px;
            }
            .thumbnail{
                width:300px;
            }
            .name{
                margin-bottom:0px;
                color: rgb(108, 107, 107);
            }
            .views{
                margin-top:0px;
                color: rgb(108, 107, 107);
            }
            .marques-video{
                width: 300px;
                display: inline-block;
            }
            .title{
                margin-top:0px;
                font-weight: 500;
                line-height: 20px;
                font-size: 16px;
            }
            .video-info{
                display: inline-block;
                width: 250px;
                padding-top: 10px;
                padding-left: 5px;
            }
            .marques-pic{
                border-radius: 20px;
                width: 100%;
            }
            .marques{
                width: 40px;
                display: inline-block;
                vertical-align: top;
                padding-top: 10px;
            }
            .markiplier-pic{
                width:40px;
                border-radius: 20px;
                vertical-align: top;
                margin-top:10px;
            }
            .thumbnail-2{
                display: inline-block;
                width: 50px;
            }
            .video-info-2{
                display: inline-block;
                width: 230px;
                margin-top: 10px;
            }
            .markiplier-video{
                display: inline-block;
                vertical-align: top;
                margin-left: 20px;
                width:300px;
            }
            .markiplier{
                width:50px;
                display: inline-block;
                vertical-align: top;
            }
        </style>
    </head>
    <body>
        <input class="searchbox" type="text" placeholder="Search">
        <div class="marques-video">
                <img class="thumbnail" src="thumbnails/thumbnail-1.webp">
                <div class="marques">
                    <img class="marques-pic" src="thumbnails/channel-1.jpeg">
                </div>
                <div class="video-info">
                    <p class="title">Talking Tech and AI with Google CEO Sundar Pichai!</p> 
                    <p class="name">Marques Brownlee</p>
                    <p class="views" >3.4M views · 6 months ago</p>
                </div>
        </div>
        <div class="markiplier-video"> 
            <img class="thumbnail" src="thumbnails/thumbnail-2.webp">
            <div class="markiplier">
                <img class="markiplier-pic" src="thumbnails/channel-2.jpeg">
            </div>
            <div class="video-info-2">
                <p class="title">Try Not To Laugh Challenge #9</p> 
                <p class="name">Markiplier</p>
                <p class="views" >19M views · 4 years ago</p>
            </div>
        </div>
    </body>
</html>
