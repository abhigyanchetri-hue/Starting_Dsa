<!DOCTYPE html>
<html>
    <head>
        <title>Youtube.com Clone</title>
        <style>
            .searchbox{
                height:30px;
                display: block;
                margin-bottom: 30px;
                margin-left:350px;
                width: 200px;
            }
            .thumbnail{
                width:300px;
            }
            .title{

            }
            .name{
                margin-bottom:0px;
                color: rgb(108, 107, 107);
            }
            .views{
                margin-top:0px;
                color: rgb(108, 107, 107);
            }
            .marques-video{
                width: 300px;
                display: inline-block;
            }
            .markiplier-video{
                display: inline-block;
                vertical-align: top;
            }
        </style>
    </head>
    <body>
        <input class="searchbox" type="text" placeholder="Search">
        <div class="marques-video"> 
            <img class="thumbnail" src="thumbnails/thumbnail-1.webp">
            <div class="title">Talking Tech and AI with Google CEO Sundar Pichai!</div> 
            <p class="name">Marques Brownlee</p>
            <p class="views" >3.4M views · 6 months ago</p>
        </div>

        <div class="markiplier-video"> 
            <img class="thumbnail" src="thumbnails/thumbnail-2.webp">
            <div class="title">Try Not To Laugh Challenge #9</div> 
            <p class="name">Markiplier</p>
            <p class="views" >19M views · 4 years ago</p>
        </div>
        
    </body>
</html>
