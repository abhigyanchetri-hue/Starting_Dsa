<!DOCTYPE html>
<html>
    <head>
        <title>Form</title>
    </head>
    <style>
        .searchbox1{
            width:120px;
            border-radius: 7px;
            height: 25px;
            border-style: solid;
            border-width: 1px;
        }
        .searchbox1::placeholder{
            padding-left: 5px;
        }
        .searchbox2{
            width:120px;
            border-radius: 7px;
            height: 25px;
            border-style: solid;
            border-width: 1px;
        }
        .searchbox2::placeholder{
            padding-left:5px;
        }
        .searchbox3{
            display: block;
            margin-top: 10px;
            border-radius: 7px;
            border-style: solid;
            border-width: 1px;
            width:250px;
            height: 28px;
        }.searchbox3::placeholder{
            padding-left: 5px;
        }
        .sign-up{
            margin-top: 10px;
            width:255px;
            border-radius: 7px;
            height: 35px;
            color: white;
            background-color: rgb(72, 72, 219);
            border-width: 1px;
        }
        .sign-up:hover{
            cursor: pointer;
        }
    </style>
    <body>
        <input class="searchbox1" type="text" placeholder="First name">
        <input class="searchbox2" type="text" placeholder="Last name">
        <input class="searchbox3" type="text" placeholder="Email">
        <button class="sign-up">Sign Up</button>
    </body>
</html>
