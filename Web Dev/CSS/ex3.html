<STYLE>
    button{
        background-color: rgb(181, 11, 11);
        border-radius: 2px;
        color: white;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 16px;
        padding-right: 16px;
        transition: opacity 0.5s, box-shadow 0.5s;
        
    }
    button:hover{
        opacity:0.8; 
        box-shadow: 5px 5px 5px rgba(0,0,0,0.15);
    }
    button:active{
        opacity:0.6;
    }
</STYLE>
